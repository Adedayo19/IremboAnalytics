version: 2

models:
  - name: fact_voice_ai_sessions
    description: "A fact table containing voice AI session data, joined with user and application information."
    columns:
      - name: id
        description: "Primary key for the fact table."
        data_type: string
        tests:
          - unique
          - not_null
      - name: session_id
        description: "Identifier for each voice AI session."
        data_type: string
        tests:
          - not_null
      - name: user_id
        description: "Unique identifier for each user."
        data_type: string
        tests:
          - not_null
      - name: region
        description: "The region of the user."
        data_type: string
      - name: disability_flag
        description: "A flag indicating if the user has a disability."
        data_type: boolean
      - name: first_time_digital_user
        description: "A flag indicating if the user is a first-time digital user."
        data_type: boolean
      - name: language
        description: "The language used in the session."
        data_type: string
      - name: total_turns
        description: "The total number of turns in the session."
        data_type: integer
      - name: avg_asr_confidence
        description: "The average ASR confidence score for the session."
        data_type: float
      - name: misunderstanding_rate
        description: "The rate of misunderstandings in the session."
        data_type: float
      - name: escalation_flag
        description: "A flag indicating if the session was escalated."
        data_type: boolean
      - name: service_code
        description: "The service code of the application."
        data_type: string
      - name: app_status
        description: "The status of the application."
        data_type: string
      - name: session_outcome
        description: "The final outcome of the session."
        data_type: string
      - name: avg_turn_duration_sec
        description: "The average duration of a turn in the session, in seconds."
        data_type: float
      - name: total_user_errors
        description: "The total number of errors made by the user in the session."
        data_type: integer
      - name: channel
        description: "The channel through which the application was submitted (e.g., voice, web)."
        data_type: string
      - name: time_to_submit_sec
        description: "Time in seconds from session start to application submission."
        data_type: float
      - name: total_duration_sec
        description: "Total duration of the voice session in seconds."
        data_type: float
      - name: created_at
        description: "Timestamp when the voice session was created."
        data_type: timestamp
      - name: avg_intent_confidence
        description: "Average intent confidence score from the AI metrics."
        data_type: float
      - name: silence_rate
        description: "Rate of silence periods during the session."
        data_type: float
      - name: recovery_success
        description: "Whether the AI successfully recovered from errors during the session."
        data_type: string
      - name: is_success
        description: "1 if the session outcome was completed, 0 otherwise."
        data_type: integer
        tests:
          - accepted_values:
              values: [0, 1]
      - name: is_ftdu
        description: "1 if the user is a first-time digital user, 0 otherwise. Supports FTDU Adoption Rate KPI."
        data_type: integer
        tests:
          - accepted_values:
              values: [0, 1]
      - name: is_rural
        description: "1 if the user is from a rural region, 0 otherwise. Supports Inclusion Success Gap KPI."
        data_type: integer
        tests:
          - accepted_values:
              values: [0, 1]
      - name: is_disabled
        description: "1 if the user has a disability, 0 otherwise. Supports User Diversity Ratio and Inclusion Success Gap KPIs."
        data_type: integer
        tests:
          - accepted_values:
              values: [0, 1]
      - name: is_vulnerable
        description: "1 if the user is disabled or from a rural region, 0 otherwise. Supports User Diversity Ratio KPI."
        data_type: integer
        tests:
          - accepted_values:
              values: [0, 1]
      - name: has_errors
        description: "1 if the session had misunderstandings or silence issues, 0 otherwise. Supports AI Recovery Success Rate KPI."
        data_type: integer
        tests:
          - accepted_values:
              values: [0, 1]
      - name: is_recovered
        description: "1 if the session had errors and the AI successfully recovered, 0 otherwise. Supports AI Recovery Success Rate KPI."
        data_type: integer
        tests:
          - accepted_values:
              values: [0, 1]
      - name: is_repeat_user
        description: "1 if the user has more than one session, 0 otherwise. Supports Repeat Usage Rate KPI."
        data_type: integer
        tests:
          - accepted_values:
              values: [0, 1]